inputs_def:
  - handle: image_name
    description: "Docker image name to download (e.g., nginx:latest, ubuntu:20.04)"
    json_schema:
      type: string
    nullable: false

  - handle: platform
    description: "Target platform and architecture for the Docker image"
    json_schema:
      type: string
      enum:
        - "linux/amd64"
        - "linux/arm64"
        - "linux/arm/v7"
        - "linux/arm/v6"
        - "linux/386"
        - "linux/ppc64le"
        - "linux/s390x"
        - "linux/riscv64"
        - "windows/amd64"
        - "windows/arm64"
      default: "linux/amd64"
      ui:widget: select
      ui:options:
        title: "Select Platform/Architecture"
    nullable: false

  - handle: output_path
    description: "Export path. If it ends with .tar, exports directly to this file.
      If it's a directory, creates tar file with image name in that directory"
    json_schema:
      type: string
      ui:widget: dir
    nullable: false

outputs_def:
  - handle: export_path
    description: "Path to the exported Docker image (tar file or folder)"
    json_schema:
      type: string

  - handle: image_id
    description: "ID of the downloaded Docker image"
    json_schema:
      type: string

  - handle: image_size
    description: "Size of the downloaded Docker image in bytes"
    json_schema:
      type: number

  - handle: export_format
    description: "The format used for export (tar or folder)"
    json_schema:
      type: string

executor:
  name: python
  options:
    entry: __init__.py
    spawn: false

title: "Docker Image Exporter"
icon: ":carbon:cloud-download:"
description: "Download Docker images with specific architecture and export them
  as tar files or extracted folders for offline use"
ui:
  default_width: 550.2010353039436
